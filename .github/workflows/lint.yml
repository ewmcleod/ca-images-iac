name: Lint workflows

# Catch classes of workflow bug that YAML parsing can't — shell injection via
# `${{ }}` in `run:` bodies, unquoted expansions, wrong action inputs, expression
# type mismatches, and (via shellcheck integration) most shell foot-guns inside
# `run:` blocks. Runs on every PR and on push to main; only touches when files
# under .github/ actually change.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/dependabot.yml
      - .github/actionlint.yaml
  pull_request:
    paths:
      - .github/workflows/**
      - .github/dependabot.yml
      - .github/actionlint.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  # Lint jobs are safe to cancel — a newer commit's lint result is what matters.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint + shellcheck
    runs-on: ubuntu-latest
    # Pure lint job — a healthy run finishes in seconds; this cap catches a
    # stuck runner well under GitHub's 6-hour default.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        env:
          # Bump alongside Dependabot notifications; keep in sync with the
          # documented "expected version" if we ever add one.
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o actionlint.tgz "$url"
          tar -xzf actionlint.tgz actionlint
          ./actionlint -version

      # actionlint auto-invokes shellcheck on `run:` bodies when shellcheck is
      # on PATH — ubuntu-latest ships with shellcheck preinstalled, so we get
      # both linters in one step without extra setup.
      - name: Run actionlint
        run: ./actionlint -color
