name: Custom Assembly Build - BU

# Build-only Custom Assembly pipeline: applies each image's config (with CA
# certificate injection) and waits for the build to finish.
#
# Routing is driven by the REQUIRED repo Actions variable BU (a "business unit"
# tag) — the workflow fails if it is not set:
#   - source (base image to customize) is the config filename minus extension
#   - target (variant repo built & tracked) is "<name>-<BU>"
# The build creates the "<name>-<BU>" variant from the named base on its first
# run, then updates it in place thereafter.

on:
  push:
    # Restrict to main so branch/PR pushes don't trigger real Chainguard
    # builds against the shared org. Use workflow_dispatch to run ad-hoc.
    branches: [main]
    paths:
      # WARNING: keep in sync with env.IMAGES_DIR below — `on:` can't reference
      # env, so update both by hand or image changes will stop triggering.
      - ca-images-iac/**
      # WARNING: keep in sync with env.CERTS_DIR below. GitHub evaluates `on:`
      # before any env exists, so this literal can't reference it — they must be
      # updated together by hand or cert changes will silently stop triggering.
      - certs/**
      - .github/workflows/custom-assembly-build-bu.yml
  workflow_dispatch:

# Least privilege at the top; each job widens only what it needs.
permissions: {}

# Serialize runs targeting the same ref+BU. This workflow updates the same
# "<image>-<BU>" variant repos in place, so two overlapping runs would race
# `chainctl build apply` against the same target and confuse the "diff report
# IDs before/after apply" wait logic. Keep cancel-in-progress: false so a
# queued run waits its turn instead of aborting a build already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ vars.BU }}
  cancel-in-progress: false

env:
  # Root directory holding one <name>.yaml Custom Assembly config per image
  # (<IMAGES_DIR>/<name>.yaml). Scanned to build the job matrix.
  # WARNING: keep in sync with the `ca-images-iac/**` path filter in
  # on.push.paths above by hand — `on:` can't reference this value.
  IMAGES_DIR: ca-images-iac

  # Global CA certificate directory — scanned for every image build. These are
  # the org's internal/private CAs, applied uniformly, not a per-image setting.
  CERTS_DIR: certs

jobs:
  # ── Discover — one matrix entry per image config ──
  # Each image is a <name>.yaml (or .yml) Custom Assembly config directly under
  # <IMAGES_DIR>/. The filename (minus extension) is the build source; the target
  # variant repo is "<name>-<BU>". Having both <name>.yaml and <name>.yml errors
  # and skips that image. If the org isn't configured or no configs exist, the
  # matrix is empty and build is skipped.
  discover:
    name: Discover images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      # 'true' only when the matrix has at least one image. The build job gates
      # on this: an empty matrix is invalid for a matrix strategy ("matrix must
      # define at least one vector"), so build is skipped rather than erroring.
      has_images: ${{ steps.set.outputs.has_images }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build matrix from image directories
        id: set
        env:
          CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG }}
          CHAINGUARD_IDENTITY: ${{ vars.CHAINGUARD_IDENTITY }}
          BU: ${{ vars.BU }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Guard — skip gracefully if Chainguard isn't configured (e.g. an
          # unconfigured fork). The run stays green, but we name the missing
          # variable(s) as a warning annotation and a job-summary note so a
          # "skipped" run isn't mistaken for a successful build. Set the missing
          # variables in repo Settings → Variables and configure an assumable
          # OIDC identity in your Chainguard organization.
          MISSING=()
          if [ -z "$CHAINGUARD_ORG" ];      then MISSING+=("CHAINGUARD_ORG"); fi
          if [ -z "$CHAINGUARD_IDENTITY" ]; then MISSING+=("CHAINGUARD_IDENTITY"); fi
          if [ ${#MISSING[@]} -gt 0 ]; then
            DOCS="https://edu.chainguard.dev/chainguard/administration/iam-organizations/assumable-ids/identity-examples/github-actions-identity/"
            echo "::warning::Skipping build — required variable(s) not set: ${MISSING[*]}. Set them in Settings → Variables. See $DOCS"
            {
              echo "### Custom Assembly Build — skipped"
              echo ""
              echo "No build ran because these repository variable(s) are not set:"
              for v in "${MISSING[@]}"; do echo "- \`$v\`"; done
              echo ""
              echo "Set them under **Settings → Secrets and variables → Actions → Variables**, then re-run."
              echo ""
              echo "Identity setup: $DOCS"
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'has_images=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Business-unit tag appended to the target variant repo name — REQUIRED.
          # Each image builds into "<dir-name>-<BU>". Set BU in repo Settings →
          # Variables; the workflow fails here if it is missing. BU is bound via
          # the step's env: block (see hardening note above).
          if [ -z "$BU" ]; then
            echo "::error::BU repo variable is not set — set it in Settings → Variables. Aborting."
            exit 1
          fi
          echo "BU='$BU' — targets will be built as '<image>-$BU'."

          # Resolve a <prefix>.yaml / <prefix>.yml pair to the one existing file.
          # rc: 0 = exactly one (path on stdout), 1 = none, 2 = both (conflict).
          resolve_yaml() {
            local y="$1.yaml" m="$1.yml"
            if [ -f "$y" ] && [ -f "$m" ]; then return 2; fi
            if [ -f "$y" ]; then printf '%s' "$y"; return 0; fi
            if [ -f "$m" ]; then printf '%s' "$m"; return 0; fi
            return 1
          }

          # Each config is a <name>.yaml (or .yml) directly under $IMAGES_DIR/.
          # The name (filename minus extension) is the base; the target is
          # "<name>-<BU>". Both <name>.yaml and <name>.yml present is an error.
          # The per-image business-unit annotation check runs later in each build
          # job (so one bad config fails only its own image, not the whole matrix).
          # Unique image names from the flat <name>.yaml/.yml configs (nullglob
          # drops the globs when nothing matches, so an empty dir yields none).
          #
          # Read into a bash array and iterate with "${names[@]}" so a filename
          # containing whitespace can't be word-split into bogus entries by the
          # default IFS (shellcheck SC2086). printf keeps names starting with
          # '-' or containing backslashes intact.
          mapfile -t names < <(
            for f in "$IMAGES_DIR"/*.yaml "$IMAGES_DIR"/*.yml; do
              b=$(basename "$f")
              printf '%s\n' "${b%.*}"
            done | sort -u
          )
          entries=()
          for name in "${names[@]}"; do
            resolved=$(resolve_yaml "$IMAGES_DIR/$name") && rc=0 || rc=$?
            if [ "$rc" -eq 2 ]; then
              echo "::error::$IMAGES_DIR has both ${name}.yaml and ${name}.yml — keep one. Skipping."; continue
            fi

            base="$name"
            target="${name}-${BU}"

            entries+=( "$(jq -nc --arg base "$base" --arg target "$target" --arg config "$resolved" \
                          '{base: $base, target: $target, config: $config}')" )
          done

          if [ ${#entries[@]} -eq 0 ]; then
            echo "::warning::No valid image directories under $IMAGES_DIR/ — nothing to build."
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'has_images=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          INCLUDE=$(printf '%s\n' "${entries[@]}" | jq -s -c '{include: .}')
          echo "Discovered images:"
          echo "$INCLUDE" | jq -r '.include[] | "  - \(.target)  (base: \(.base), config: \(.config))"'
          echo "matrix=$INCLUDE" >> "$GITHUB_OUTPUT"
          echo 'has_images=true' >> "$GITHUB_OUTPUT"

  # ── Build — one isolated job per image (fail-fast: false) ──
  # Apply each image's config (+ certificates) and wait for the async build to
  # finish. A slow or failing image only fails its own job, not the others.
  build:
    name: Build ${{ matrix.target }}
    needs: discover
    # Skip entirely when discover found nothing — a matrix from an empty include
    # is invalid ("matrix must define at least one vector") and would error.
    if: needs.discover.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # OIDC auth with chainctl
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    env:
      CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG }}
      CHAINGUARD_BASE: ${{ matrix.base }}      # Chainguard image being customized (dir name)
      CHAINGUARD_REPO: ${{ matrix.target }}    # repo built & tracked (<base>-<BU>)
      CONFIG_FILE: ${{ matrix.config }}        # pure Custom Assembly config
      CHAINGUARD_BU: ${{ vars.BU }}            # required business-unit tag; must match the config annotation

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Enforce that this image's config declares a business-unit annotation
      # matching the BU variable — failing only this image's job (fail-fast is
      # off), not the whole matrix. The annotation key may carry any reverse-DNS
      # prefix (e.g. com.acme.business-unit or com.companyname.business-unit); we
      # match any key whose final dotted segment is exactly 'business-unit' and
      # require exactly one distinct value equal to BU.
      - name: Verify business-unit annotation matches BU
        run: |
          set -euo pipefail
          if [ -z "$CHAINGUARD_BU" ]; then
            echo "::error::BU repo variable is not set — set it in Settings → Variables. Aborting."
            exit 1
          fi
          # Use [.] (character class) rather than \. — \. is not a defined
          # JSON string escape, so its meaning inside jq/yq's regex string is
          # implementation-dependent. The character class is portable.
          mapfile -t bu_vals < <(
            yq '(.annotations // {}) | to_entries[]
                  | select(.key | test("(^|[.])business-unit$")) | .value' "$CONFIG_FILE" 2>/dev/null \
              | sort -u
          )
          if [ "${#bu_vals[@]}" -eq 0 ]; then
            echo "::error::$CONFIG_FILE has no '*business-unit' annotation (must equal BU='$CHAINGUARD_BU'). Aborting."
            exit 1
          elif [ "${#bu_vals[@]}" -gt 1 ]; then
            echo "::error::$CONFIG_FILE has conflicting business-unit annotations (${bu_vals[*]}) — keep one. Aborting."
            exit 1
          fi
          if [ "${bu_vals[0]}" != "$CHAINGUARD_BU" ]; then
            echo "::error::$CONFIG_FILE business-unit='${bu_vals[0]}' but repo variable BU='$CHAINGUARD_BU' — they must match. Aborting."
            exit 1
          fi
          echo "business-unit '$CHAINGUARD_BU' verified for $CONFIG_FILE."

      - name: Setup chainctl
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ vars.CHAINGUARD_IDENTITY }}

      # Build the chainctl invocation dynamically: pick the apply mode (customize
      # in place / update variant / create variant via --save-as), then append one
      # `--with-certificates=<file>` flag per CA certificate found under $CERTS_DIR.
      # `build apply` is async and returns no digest, so we snapshot existing build
      # report IDs to identify the build(s) it triggers.
      - name: Apply config + certificates
        id: customize
        run: |
          set -euo pipefail

          # Pick the apply mode. The target is always the "<base>-<BU>" variant.
          # `--save-as` CREATES a new variant repo and errors if it already exists,
          # so it's used only for the variant's first build:
          #   - <base>-<BU> target exists: update the variant in place
          #   - <base>-<BU> target missing: create it from the base via --save-as
          #
          # Probe with `chainctl images repos list`, not `... build list`.
          # `images repos list` exits 0 for both outcomes and just returns an
          # empty `.items` array when the repo doesn't exist — so a transient
          # non-zero exit (auth blip, network) fails loudly under `set -e`
          # instead of being misread as "repo doesn't exist" and misrouting
          # us into `--save-as` against a repo that already exists.
          ARGS=( images repos build apply --parent "$CHAINGUARD_ORG" --file "$CONFIG_FILE" --yes )
          EXISTS=$(chainctl images repos list \
                     --parent "$CHAINGUARD_ORG" --repo "$CHAINGUARD_REPO" \
                     --output json | jq '.items | length')
          if [ "$EXISTS" -gt 0 ]; then
            echo "Updating existing variant '$CHAINGUARD_REPO'."
            ARGS+=( --repo "$CHAINGUARD_REPO" )
          else
            echo "Creating variant '$CHAINGUARD_REPO' from base '$CHAINGUARD_BASE'."
            ARGS+=( --repo "$CHAINGUARD_BASE" --save-as "$CHAINGUARD_REPO" )
          fi

          # Discover additional CA certificates and add a flag for each.
          CERT_COUNT=0
          if [ -n "$CERTS_DIR" ] && [ -d "$CERTS_DIR" ]; then
            while IFS= read -r -d '' cert; do
              echo "Adding CA certificate: $cert"
              ARGS+=( "--with-certificates=$cert" )
              CERT_COUNT=$((CERT_COUNT + 1))
            done < <(find "$CERTS_DIR" -type f \
                        \( -iname '*.pem' -o -iname '*.crt' -o -iname '*.cer' -o -iname '*.ca' \) \
                        -print0 | sort -z)
          else
            echo "No certificate directory '${CERTS_DIR:-<none>}' — building without extra CAs."
          fi
          echo "Found $CERT_COUNT additional CA certificate(s)."

          # Snapshot existing report IDs so the wait step can identify this apply's build(s).
          # A brand-new repo has no build history yet — `build list` exits non-zero,
          # which under `set -e`/`pipefail` would abort before the apply that creates
          # it. Tolerate that by defaulting to an empty array.
          BEFORE_IDS=$(chainctl images repos build list \
            --parent "$CHAINGUARD_ORG" --repo "$CHAINGUARD_REPO" \
            --output json 2>/dev/null | jq -c '[.reports[].id]' || echo '[]')
          BEFORE_IDS=${BEFORE_IDS:-[]}
          echo "before_ids=$BEFORE_IDS" >> "$GITHUB_OUTPUT"

          set +e
          APPLY_OUT=$(chainctl "${ARGS[@]}" 2>&1)
          APPLY_RC=$?
          set -e
          echo "$APPLY_OUT"
          if [ "$APPLY_RC" -ne 0 ]; then
            echo "Error: chainctl build apply exited with code $APPLY_RC." >&2
            exit "$APPLY_RC"
          fi

          # Anchor the match to the exact chainctl "no changes" line rather than
          # a bare substring, so an unrelated build-log line containing that
          # phrase can't accidentally short-circuit the wait step. If chainctl
          # ever reworders this message, the wait step below will time out with
          # a loud "timed out after 10m" error rather than silently skipping.
          if echo "$APPLY_OUT" | grep -qE "^No changes detected in build config for "; then
            echo "Image already up to date — no new build triggered."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      # Wait for the triggered build(s) to finish and fail if any did not
      # succeed. Identifies them as report IDs absent before the apply, so
      # concurrent/historical builds don't confuse completion detection.
      - name: Wait for build to complete
        if: steps.customize.outputs.skipped != 'true'
        env:
          BEFORE_IDS: ${{ steps.customize.outputs.before_ids }}
        run: |
          set -euo pipefail

          # Tolerate a transient/just-created repo: a save-as variant's first
          # build isn't immediately listable, and `build list` exits non-zero
          # until it is. Emit empty JSON instead of letting set -e/pipefail abort
          # the step, so the loop keeps polling until the build report appears.
          list_reports() {
            chainctl images repos build list \
              --parent "$CHAINGUARD_ORG" --repo "$CHAINGUARD_REPO" \
              --output json 2>/dev/null || echo '{"reports":[]}'
          }

          echo "Waiting for custom build(s) of '$CHAINGUARD_REPO' to complete..."
          DEADLINE=$(( $(date +%s) + 600 ))   # 10 minute budget
          while :; do
            NEW=$(list_reports | jq -c --argjson before "$BEFORE_IDS" \
                    '[(.reports // [])[] | select((.id as $i | $before | index($i)) | not)]')
            TOTAL=$(echo "$NEW"   | jq 'length')
            PENDING=$(echo "$NEW" | jq '[.[] | select(.result == null)] | length')
            echo "  triggered reports: total=$TOTAL pending=$PENDING"

            if [ "$TOTAL" -gt 0 ] && [ "$PENDING" -eq 0 ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "Error: timed out after 10m waiting for build(s)." >&2
              echo "$NEW" | jq -r '.[] | "  \(.startedAt) \((.config|fromjson).annotations["dev.chainguard.package.main"]) \(.result // "pending")"' >&2
              exit 1
            fi
            sleep 20
          done

          FAILED=$(echo "$NEW" | jq -c '[.[] | select(.result != "Success")]')
          if [ "$(echo "$FAILED" | jq 'length')" -ne 0 ]; then
            echo "Error: one or more triggered builds of '$CHAINGUARD_REPO' did not succeed:" >&2
            echo "$FAILED" | jq -r '.[] | "  \(.startedAt) \((.config|fromjson).annotations["dev.chainguard.package.main"]) \(.result)"' >&2
            echo "Log of most recent failed attempt:" >&2
            echo "$FAILED" | jq -r 'sort_by(.completedAt) | last | .log' | tail -c 3000 >&2
            exit 1
          fi
          echo "All triggered builds of '$CHAINGUARD_REPO' completed successfully."
