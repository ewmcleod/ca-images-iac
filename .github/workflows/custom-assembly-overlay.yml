name: Custom Assembly Overlay

# Overlay-based Custom Assembly: *overlays* are org-level, reusable customizations
# (packages, env, annotations, accounts, certificates) that are attached to
# repos via *bindings* with a tag selector. Unlike `chainctl images repos build
# apply`, nothing is built from a config directly: Chainguard rebuilds the
# matching tags asynchronously whenever an overlay or binding changes.
#
# For every <OVERLAYS_DIR>/<name>.yaml this workflow reconciles an org-level
# overlay named exactly "<name>" to match the file. There is no business-unit
# routing: an overlay is shared, and where it applies is declared explicitly by
# its `bindings:` rather than by a "<name>-<BU>" variant repo.
#   1. create the overlay, or update it if its content digest changed
#      (config + global CA certs from certs/)
#   2. attach any declared binding that doesn't exist yet
#   3. update-binding where the tag selector changed
#   4. detach bindings of this overlay that are no longer declared
#      (when PRUNE_BINDINGS is "true")
#
# NOTE: a repo cannot use both standard (legacy) Custom Assembly and overlays.
# Don't bind overlays to repos that custom-assembly-build*.yml customize.

on:
  push:
    # Restrict to main so branch/PR pushes don't change the shared org.
    branches: [main]
    paths:
      # WARNING: keep in sync with env.OVERLAYS_DIR / env.CERTS_DIR below —
      # `on:` can't reference env, so update both by hand.
      - ca-overlays/**
      - certs/**
      - .github/workflows/custom-assembly-overlay.yml
  workflow_dispatch:

permissions: {}

# Serialize runs per ref: overlapping runs would race create/attach on the
# same overlays. Never cancel a run mid-reconcile.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # One <name>.yaml (or .yml) overlay definition per file, directly under this
  # directory. Subdirectories (e.g. examples/) are NOT scanned.
  # WARNING: keep in sync with the `ca-overlays/**` path filter in
  # on.push.paths above — `on:` can't reference env.
  OVERLAYS_DIR: ca-overlays

  # Global CA certificate directory — attached to EVERY overlay.
  CERTS_DIR: certs

  # Annotation stamped into each overlay's config holding a sha256 of the
  # desired config + certificates. The full key is "<prefix>.<overlay-name>" —
  # per overlay, because overlay annotations are copied into every rebuilt
  # image's build config, and when several overlays layer onto one tag a shared
  # key would be overwritten by the last layer. It serves two purposes:
  #   - a re-run detects "unchanged" and skips `overlays update` (no rebuilds)
  #   - the rebuild check identifies exactly which build reports this overlay
  #     version produced
  DIGEST_ANNOTATION_PREFIX: dev.ca-images-iac.overlay-digest

  # Rebuild check — one job after ALL overlays reconcile, checked per repo.
  # Several overlays can bind to the same repo (e.g. an all-tags overlay plus
  # a -dev overlay), and Chainguard processes each overlay change as its own
  # rebuild wave, serialized per repo: the second overlay's wave only starts
  # once the first one has drained (~minutes later). So per repo, "done" means:
  #   - every overlay that changed on it has at least one matching report,
  #   - nothing new is pending, and no new report / result change for
  #     REBUILD_SETTLE_SECONDS.
  # An overlay that still has no report once the repo has been idle for
  # REBUILD_FIRST_REPORT_SECONDS is warned about and skipped (e.g. an
  # exact-tags binding to tags that don't exist yet produces no builds).
  REBUILD_TIMEOUT_SECONDS: "2700"
  REBUILD_FIRST_REPORT_SECONDS: "300"
  REBUILD_SETTLE_SECONDS: "90"

  # "true": detach bindings of a managed overlay that the file no longer
  # declares (the file is the source of truth). Anything else: only warn.
  PRUNE_BINDINGS: "true"

jobs:
  # ── Discover — one matrix entry per overlay file ──
  discover:
    name: Discover overlays
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      has_overlays: ${{ steps.set.outputs.has_overlays }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build matrix from overlay files
        id: set
        env:
          CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG }}
          CHAINGUARD_IDENTITY: ${{ vars.CHAINGUARD_IDENTITY }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Guard — skip gracefully (green, but loudly annotated) if Chainguard
          # isn't configured, e.g. on an unconfigured fork.
          MISSING=()
          if [ -z "$CHAINGUARD_ORG" ];      then MISSING+=("CHAINGUARD_ORG"); fi
          if [ -z "$CHAINGUARD_IDENTITY" ]; then MISSING+=("CHAINGUARD_IDENTITY"); fi
          if [ ${#MISSING[@]} -gt 0 ]; then
            DOCS="https://edu.chainguard.dev/chainguard/administration/iam-organizations/assumable-ids/identity-examples/github-actions-identity/"
            echo "::warning::Skipping overlay reconcile — required variable(s) not set: ${MISSING[*]}. See $DOCS"
            {
              echo "### Custom Assembly Overlays — skipped"
              echo ""
              echo "Nothing ran because these repository variable(s) are not set:"
              for v in "${MISSING[@]}"; do echo "- \`$v\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'has_overlays=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          resolve_yaml() {
            local y="$1.yaml" m="$1.yml"
            if [ -f "$y" ] && [ -f "$m" ]; then return 2; fi
            if [ -f "$y" ]; then printf '%s' "$y"; return 0; fi
            if [ -f "$m" ]; then printf '%s' "$m"; return 0; fi
            return 1
          }

          mapfile -t names < <(
            for f in "$OVERLAYS_DIR"/*.yaml "$OVERLAYS_DIR"/*.yml; do
              b=$(basename "$f")
              printf '%s\n' "${b%.*}"
            done | sort -u
          )
          entries=()
          for name in "${names[@]}"; do
            resolved=$(resolve_yaml "$OVERLAYS_DIR/$name") && rc=0 || rc=$?
            if [ "$rc" -eq 2 ]; then
              echo "::error::$OVERLAYS_DIR has both ${name}.yaml and ${name}.yml — keep one. Skipping."; continue
            fi
            entries+=( "$(jq -nc --arg overlay "$name" --arg config "$resolved" \
                          '{overlay: $overlay, config: $config}')" )
          done

          if [ ${#entries[@]} -eq 0 ]; then
            echo "::warning::No overlay files under $OVERLAYS_DIR/ — nothing to reconcile."
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'has_overlays=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          INCLUDE=$(printf '%s\n' "${entries[@]}" | jq -s -c '{include: .}')
          echo "Discovered overlays:"
          echo "$INCLUDE" | jq -r '.include[] | "  - \(.overlay)  (config: \(.config))"'
          echo "matrix=$INCLUDE" >> "$GITHUB_OUTPUT"
          echo 'has_overlays=true' >> "$GITHUB_OUTPUT"

  # ── Reconcile — one isolated job per overlay (fail-fast: false) ──
  reconcile:
    name: Overlay ${{ matrix.overlay }}
    needs: discover
    if: needs.discover.outputs.has_overlays == 'true'
    runs-on: ubuntu-latest
    # Reconcile is seconds; the rebuild check runs in its own job.
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write     # OIDC auth with chainctl
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    env:
      CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG }}
      OVERLAY_NAME: ${{ matrix.overlay }}
      CONFIG_FILE: ${{ matrix.config }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Validate the `bindings:` block and normalize it to JSON:
      #   [{target: "repo:<name>"|"all-repos", repo, all_repos, sel: {kind, tags}}]
      # Rules per binding: exactly one of `repo` / `all-repos: true`; exactly
      # one of `all-tags: true` / `tag-variant: dev` / `exact-tags: [...]`;
      # exact tags must be YAML strings (unquoted 3.10 would parse as 3.1);
      # no two bindings may target the same repo (an overlay attaches to a
      # repo only once).
      - name: Validate bindings
        id: bindings
        run: |
          set -euo pipefail

          if [ "$(yq '(.bindings // []) | tag' "$CONFIG_FILE")" != "!!seq" ]; then
            echo "::error::$CONFIG_FILE: 'bindings' must be a list."; exit 1
          fi
          BAD_TAGS=$(yq '[(.bindings // [])[] | (.["exact-tags"] // [])[] | select(tag != "!!str")] | length' "$CONFIG_FILE")
          if [ "$BAD_TAGS" -ne 0 ]; then
            echo "::error::$CONFIG_FILE: every exact-tags entry must be a quoted string (e.g. \"3.10\", not 3.10)."; exit 1
          fi

          RAW=$(yq -o json -I0 '.bindings // []' "$CONFIG_FILE")
          ERRORS=$(jq -r '
            to_entries[] | .key as $i | .value as $b
            | ( [ ($b.repo // null | . != null), ($b["all-repos"] == true) ] | map(select(.)) | length ) as $t
            | ( [ ($b["all-tags"] == true), ($b["tag-variant"] // null | . != null),
                  (($b["exact-tags"] // []) | length > 0) ] | map(select(.)) | length ) as $s
            | (if $t != 1 then "binding[\($i)]: set exactly one of repo / all-repos: true" else empty end),
              (if $s != 1 then "binding[\($i)]: set exactly one of all-tags: true / tag-variant / exact-tags" else empty end),
              (if ($b["tag-variant"] // "dev") != "dev" then "binding[\($i)]: tag-variant only supports \"dev\"" else empty end)
          ' <<<"$RAW")
          if [ -n "$ERRORS" ]; then
            while IFS= read -r e; do echo "::error::$CONFIG_FILE: $e"; done <<<"$ERRORS"
            exit 1
          fi

          DESIRED=$(jq -c '
            map({
              target:    (if .["all-repos"] == true then "all-repos" else "repo:\(.repo)" end),
              repo:      (if .["all-repos"] == true then null else (.repo | tostring) end),
              all_repos: (.["all-repos"] == true),
              sel: (if .["all-tags"] == true then {kind: "KIND_ALL", tags: []}
                    elif .["tag-variant"] then {kind: "KIND_VARIANT", tags: []}
                    else {kind: "KIND_EXACT", tags: (.["exact-tags"] | map(tostring) | unique)} end)
            })' <<<"$RAW")
          DUPES=$(jq -r 'group_by(.target)[] | select(length > 1) | .[0].target' <<<"$DESIRED")
          if [ -n "$DUPES" ]; then
            echo "::error::$CONFIG_FILE: more than one binding targets: $DUPES — an overlay attaches to a repo only once."; exit 1
          fi
          if [ "$(jq length <<<"$DESIRED")" -eq 0 ]; then
            echo "::warning::$CONFIG_FILE declares no bindings — the overlay will exist but apply to nothing."
          fi
          echo "Desired bindings:"; jq -r '.[] | "  - \(.target)  \(.sel.kind) \(.sel.tags | join(","))"' <<<"$DESIRED"
          echo "desired=$DESIRED" >> "$GITHUB_OUTPUT"

      - name: Setup chainctl
        uses: chainguard-dev/setup-chainctl@bfe7503a12660737d9d66d02d2610a399d804316 # v0.6.0
        with:
          identity: ${{ vars.CHAINGUARD_IDENTITY }}

      - name: Reconcile overlay + bindings
        id: reconcile
        env:
          DESIRED: ${{ steps.bindings.outputs.desired }}
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          ACTIONS=()
          note() { echo "$1"; ACTIONS+=("$1"); }
          # Set when something changed that makes Chainguard rebuild tags with
          # this overlay (create/update overlay, attach, update-binding). A
          # detach alone doesn't: those rebuilds no longer carry the overlay.
          CHANGED=false
          DIGEST_KEY="${DIGEST_ANNOTATION_PREFIX}.${OVERLAY_NAME}"
          DIGEST=""
          BEFORE='{}'

          # Hand-off to the rebuild-check job, written on ANY exit so a run
          # that fails after already changing the overlay still gets checked.
          RESULT_DIR="$RUNNER_TEMP/reconcile-result"
          mkdir -p "$RESULT_DIR"
          write_result() {
            jq -n --arg overlay "$OVERLAY_NAME" --argjson changed "$CHANGED" \
                  --arg digest_key "$DIGEST_KEY" --arg digest "$DIGEST" --argjson before "$BEFORE" \
                  '{overlay: $overlay, changed: $changed, digest_key: $digest_key,
                    digest: $digest, before: $before}' > "$RESULT_DIR/$OVERLAY_NAME.json"
          }
          trap write_result EXIT

          # ── Desired overlay config: the file minus `bindings` ──
          yq 'del(.bindings)' "$CONFIG_FILE" > "$WORK/config.yaml"

          # Global CA certificates (passed as one comma-separated flag).
          CERTS=()
          if [ -n "$CERTS_DIR" ] && [ -d "$CERTS_DIR" ]; then
            while IFS= read -r -d '' cert; do
              case "$cert" in *,*)
                echo "::error::Certificate path '$cert' contains a comma — --with-certificates is comma-separated. Rename it."; exit 1;;
              esac
              CERTS+=("$cert")
            done < <(find "$CERTS_DIR" -type f \
                        \( -iname '*.pem' -o -iname '*.crt' -o -iname '*.cer' -o -iname '*.ca' \) \
                        -print0 | sort -z)
          fi
          echo "Found ${#CERTS[@]} CA certificate(s)."
          CERT_ARGS=()
          if [ ${#CERTS[@]} -gt 0 ]; then
            CERT_ARGS=( --with-certificates "$(IFS=,; echo "${CERTS[*]}")" )
          fi

          # Content digest over canonicalized config + cert names/contents,
          # stamped into the config so a re-run can detect "no change".
          DIGEST=$(
            {
              yq -o json -I0 'sort_keys(..)' "$WORK/config.yaml"
              for c in "${CERTS[@]}"; do printf '%s\n' "$c"; sha256sum < "$c"; done
            } | sha256sum | cut -d' ' -f1
          )
          DIGEST="$DIGEST" DIGEST_KEY="$DIGEST_KEY" \
            yq -i '.annotations[strenv(DIGEST_KEY)] = strenv(DIGEST)' "$WORK/config.yaml"
          echo "Desired overlay digest: $DIGEST_KEY=$DIGEST"

          # Snapshot existing build report IDs on every bound repo BEFORE any
          # change, so the rebuild check only counts reports created after it.
          # Fails loudly: a repo that can't be listed (typo, missing, no
          # access) would also fail `attach`, and a silent empty snapshot would
          # let historical reports be mistaken for this run's.
          # Other overlay jobs run in parallel and may already have triggered
          # rebuilds on a shared repo; the rebuild-check job therefore treats a
          # report as pre-existing only if it is in EVERY changed overlay's
          # snapshot for that repo.
          # all-repos bindings are not checked (unbounded repo set).
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            ids=$(chainctl images repos build list --parent "$CHAINGUARD_ORG" --repo "$repo" \
                    --output json | jq -c '[(.reports // [])[].id]')
            BEFORE=$(jq -c --arg r "$repo" --argjson ids "$ids" '. + {($r): $ids}' <<<"$BEFORE")
          done < <(jq -r '.[] | select(.all_repos | not) | .repo' <<<"$DESIRED")
          if jq -e 'any(.all_repos)' <<<"$DESIRED" >/dev/null; then
            echo "::notice::$OVERLAY_NAME has an all-repos binding — its rebuilds are not checked."
          fi

          list_overlay() {
            chainctl images overlays list --parent "$CHAINGUARD_ORG" -o json \
              | jq -c --arg n "$OVERLAY_NAME" '[(.overlays // [])[] | select(.name == $n)]'
          }

          # ── 1. Create or update the overlay ──
          CURRENT=$(list_overlay)
          case "$(jq length <<<"$CURRENT")" in
            0)
              chainctl images overlays create "$OVERLAY_NAME" --parent "$CHAINGUARD_ORG" \
                -f "$WORK/config.yaml" "${CERT_ARGS[@]}"
              note "created overlay \`$OVERLAY_NAME\`"
              CHANGED=true
              CURRENT=$(list_overlay)
              ;;
            1)
              OVERLAY_ID=$(jq -r '.[0].id' <<<"$CURRENT")
              STORED=$(jq -r --arg k "$DIGEST_KEY" '.[0].config.annotations[$k] // ""' <<<"$CURRENT")
              if [ "$STORED" = "$DIGEST" ]; then
                note "overlay \`$OVERLAY_NAME\` unchanged"
              else
                # -f replaces the stored config wholesale; certs merge into it.
                chainctl images overlays update "$OVERLAY_ID" -f "$WORK/config.yaml" "${CERT_ARGS[@]}"
                note "updated overlay \`$OVERLAY_NAME\` (digest ${STORED:-<none>} → $DIGEST)"
                CHANGED=true
              fi
              ;;
            *)
              echo "::error::Multiple overlays named '$OVERLAY_NAME' in $CHAINGUARD_ORG — resolve by hand."; exit 1
              ;;
          esac
          if [ "$(jq length <<<"$CURRENT")" -ne 1 ]; then
            echo "::error::Overlay '$OVERLAY_NAME' not found after create."; exit 1
          fi
          OVERLAY_ID=$(jq -r '.[0].id' <<<"$CURRENT")

          # ── 2–4. Reconcile bindings ──
          # Normalize existing bindings to the same shape as DESIRED. The kind
          # is matched loosely (ALL / VARIANT / EXACT substring) so enum naming
          # differences in the API don't cause perpetual update-binding churn.
          EXISTING=$(jq -c '
            [.[0].bindings // [] | .[] | {
              id,
              target: (if .all_repos then "all-repos" else "repo:\(.repo.name)" end),
              sel: {
                kind: ((.selector.kind // "") as $k
                       | if   ($k | test("EXACT"))   then "KIND_EXACT"
                         elif ($k | test("VARIANT")) then "KIND_VARIANT"
                         elif ($k | test("ALL"))     then "KIND_ALL"
                         else $k end),
                tags: ((.selector.tags // []) | unique)
              }
            }]' <<<"$CURRENT")

          selector_args() {
            jq -r '.sel | if .kind == "KIND_ALL" then "--all-tags"
                          elif .kind == "KIND_VARIANT" then "--tag-variant=dev"
                          else (.tags[] | "--exact-tag=\(.)") end' <<<"$1"
          }

          while IFS= read -r b; do
            [ -n "$b" ] || continue
            target=$(jq -r '.target' <<<"$b")
            match=$(jq -c --arg t "$target" 'map(select(.target == $t)) | first // empty' <<<"$EXISTING")
            mapfile -t SEL < <(selector_args "$b")
            if [ -z "$match" ]; then
              TARGET_ARGS=( --all-repos )
              if [ "$(jq -r '.all_repos' <<<"$b")" != "true" ]; then
                TARGET_ARGS=( --repo "$(jq -r '.repo' <<<"$b")" )
              fi
              chainctl images overlays attach --overlay "$OVERLAY_ID" --parent "$CHAINGUARD_ORG" \
                "${TARGET_ARGS[@]}" "${SEL[@]}"
              note "attached → $target (${SEL[*]})"
              CHANGED=true
            elif [ "$(jq -c '.sel' <<<"$match")" != "$(jq -c '.sel' <<<"$b")" ]; then
              chainctl images overlays update-binding "$(jq -r '.id' <<<"$match")" "${SEL[@]}"
              note "updated binding → $target (${SEL[*]})"
              CHANGED=true
            else
              note "binding → $target unchanged"
            fi
          done < <(jq -c '.[]' <<<"$DESIRED")

          while IFS= read -r stale; do
            [ -n "$stale" ] || continue
            sid=$(jq -r '.id' <<<"$stale"); st=$(jq -r '.target' <<<"$stale")
            if [ "$PRUNE_BINDINGS" = "true" ]; then
              chainctl images overlays detach "$sid"
              note "detached undeclared binding → $st"
            else
              echo "::warning::Overlay '$OVERLAY_NAME' has undeclared binding → $st ($sid); PRUNE_BINDINGS is off, leaving it."
            fi
          done < <(jq -c --argjson d "$DESIRED" \
                     '.[] | select(.target as $t | ($d | map(.target) | index($t)) | not)' <<<"$EXISTING")

          {
            echo "### Overlay \`$OVERLAY_NAME\`"
            echo ""
            for a in "${ACTIONS[@]}"; do echo "- $a"; done
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reconcile result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reconcile-${{ matrix.overlay }}
          path: ${{ runner.temp }}/reconcile-result/
          if-no-files-found: ignore
          retention-days: 1

  # ── Rebuild check — once, after every overlay has reconciled ──
  # Checked per repo rather than per overlay: overlays that share a repo share
  # its rebuilds (a -dev tag rebuilt for one overlay also carries the other),
  # and Chainguard runs each overlay change as its own wave, one after another
  # per repo — so the second overlay's rebuilds may start many minutes after
  # its change. Waiting per overlay in parallel jobs missed those entirely.
  rebuild-check:
    name: Rebuild check
    needs: [discover, reconcile]
    # always(): one overlay failing to reconcile must not skip checking the
    # rebuilds the others (or its own partial changes) triggered.
    if: always() && needs.discover.outputs.has_overlays == 'true'
    runs-on: ubuntu-latest
    # REBUILD_TIMEOUT_SECONDS (45m) plus headroom.
    timeout-minutes: 55
    permissions:
      id-token: write     # OIDC auth with chainctl
    env:
      CHAINGUARD_ORG: ${{ vars.CHAINGUARD_ORG }}
    steps:
      - name: Download reconcile results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reconcile-*
          merge-multiple: true
          path: ${{ runner.temp }}/reconcile-results

      # Per repo: the overlays that changed on it (name, digest key, new
      # digest) and the pre-change snapshot. Overlay jobs snapshot in parallel,
      # so one job's snapshot may already contain another job's first
      # rebuilds — a report is pre-existing only if EVERY changed overlay's
      # snapshot has it (intersection).
      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP/reconcile-results"/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No reconcile results — nothing to check."
            echo "has_work=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          jq -s -c '
            [ .[] | select(.changed and .digest != "")
              | {name: .overlay, key: .digest_key, digest: .digest} as $o
              | .before | to_entries[] | {repo: .key, before: .value, overlay: $o} ]
            | group_by(.repo)
            | map({ (.[0].repo): {
                      overlays: map(.overlay),
                      before: (map(.before) | reduce .[1:][] as $b (.[0]; . - (. - $b))) } })
            | add // {}' "${files[@]}" > "$RUNNER_TEMP/rebuild-plan.json"
          if [ "$(jq length "$RUNNER_TEMP/rebuild-plan.json")" -eq 0 ]; then
            echo "No overlay changes that trigger checked rebuilds."
            echo "has_work=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Rebuilds to check:"
          jq -r 'to_entries[] | "  - \(.key): \(.value.overlays | map(.name) | join(", "))"' "$RUNNER_TEMP/rebuild-plan.json"
          echo "has_work=true" >> "$GITHUB_OUTPUT"

      - name: Setup chainctl
        if: steps.plan.outputs.has_work == 'true'
        uses: chainguard-dev/setup-chainctl@bfe7503a12660737d9d66d02d2610a399d804316 # v0.6.0
        with:
          identity: ${{ vars.CHAINGUARD_IDENTITY }}

      # A report counts when it (a) is not in the repo's pre-change snapshot
      # and (b) carries the new digest annotation of at least one overlay that
      # changed on that repo — so unrelated rebuilds (upstream package
      # updates) are ignored.
      #
      # `build list` returns only the ~30 newest reports, so a big wave pushes
      # its own early reports out of the window: reports are accumulated by id
      # across polls instead of re-derived from each listing.
      - name: Wait for rebuilds
        if: steps.plan.outputs.has_work == 'true'
        run: |
          set -euo pipefail
          PLAN=$(cat "$RUNNER_TEMP/rebuild-plan.json")
          mapfile -t REPOS < <(jq -r 'keys[]' <<<"$PLAN")

          # New reports on a repo as {id: report}. Tolerates transient chainctl
          # errors — no reports just means "try again next tick".
          fetch_new() {
            local repo="$1"
            { chainctl images repos build list --parent "$CHAINGUARD_ORG" --repo "$repo" \
                --output json 2>/dev/null || echo '{"reports":[]}'; } \
              | jq -c --arg r "$repo" --argjson p "$(jq -c --arg r "$repo" '.[$r]' <<<"$PLAN")" '
                  [ (.reports // [])[]
                    | select(.id as $i | $p.before | any(.[]; . == $i) | not)
                    | (.config | fromjson? // {}) as $c
                    | (($c.annotations // {})) as $a
                    | { repo: $r, id, startedAt, result,
                        # changed overlays whose new version this build carries
                        overlays: [ $p.overlays[] | select($a[.key] == .digest) | .name ],
                        main: ($a["dev.chainguard.package.main"] // "?"),
                        # 3.13 and 3.13-dev share the same main package; -dev
                        # images are told apart by shipping apk-tools.
                        dev: (($c.contents.packages // []) | any(startswith("apk-tools"))),
                        error: ((.log // "") | split("\n") | map(fromjson? | select(.level? == "ERROR") | .msg) | last // null) } ]
                  | map({(.id): .}) | add // {}'
          }

          SEEN='{}'          # {repo: {id: report}}
          declare -A SIG LAST_CHANGE FINISHED
          START=$(date +%s)
          DEADLINE=$(( START + REBUILD_TIMEOUT_SECONDS ))
          for repo in "${REPOS[@]}"; do LAST_CHANGE[$repo]=$START; done
          echo "Waiting for rebuilds of: ${REPOS[*]}"

          while :; do
            NOW=$(date +%s)
            ALL_DONE=true
            for repo in "${REPOS[@]}"; do
              [ -n "${FINISHED[$repo]:-}" ] && continue
              SEEN=$(jq -c --arg r "$repo" --argjson n "$(fetch_new "$repo")" \
                       '.[$r] = ((.[$r] // {}) + $n)' <<<"$SEEN")
              R=$(jq -c --arg r "$repo" '[(.[$r] // {})[]]' <<<"$SEEN")

              # Activity = any new report or result change on the repo, matched
              # or not: a wave for another overlay still means the queue is busy.
              sig=$(jq -c 'map([.id, .result]) | sort' <<<"$R")
              if [ "$sig" != "${SIG[$repo]:-}" ]; then SIG[$repo]=$sig; LAST_CHANGE[$repo]=$NOW; fi
              IDLE=$(( NOW - LAST_CHANGE[$repo] ))

              PENDING=$(jq '[.[] | select(.result == null)] | length' <<<"$R")
              MATCHED=$(jq '[.[] | select(.overlays | length > 0)] | length' <<<"$R")
              mapfile -t MISSING < <(jq -r --argjson p "$(jq -c --arg r "$repo" '.[$r]' <<<"$PLAN")" '
                . as $all | $p.overlays[].name
                | select(. as $n | $all | any(.[]; .overlays | any(.[]; . == $n)) | not)' <<<"$R")
              echo "  [$(( NOW - START ))s] $repo: new=$(jq length <<<"$R") matched=$MATCHED pending=$PENDING idle=${IDLE}s${MISSING[0]:+ waiting-for=${MISSING[*]}}"

              if [ "$PENDING" -eq 0 ] && [ "$IDLE" -ge "$REBUILD_SETTLE_SECONDS" ]; then
                if [ ${#MISSING[@]} -eq 0 ]; then
                  FINISHED[$repo]=1; continue
                elif [ "$IDLE" -ge "$REBUILD_FIRST_REPORT_SECONDS" ]; then
                  for o in "${MISSING[@]}"; do
                    echo "::warning::$repo: no rebuild carrying overlay '$o' appeared and the repo has been idle ${IDLE}s — nothing to check for it (no matching tags, or the org is not enrolled for overlay rebuilds)."
                  done
                  FINISHED[$repo]=1; continue
                fi
              fi
              ALL_DONE=false
            done
            $ALL_DONE && break
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              TIMED_OUT=true; break
            fi
            sleep 20
          done

          # Keep only the latest matching report per tag stream (repo + main
          # package + dev): a stream is rebuilt once per overlay wave (and on
          # retries), and the latest result is what's served.
          LATEST=$(jq -c '
            [.[][] | select(.overlays | length > 0)]
            | group_by([.repo, .main, .dev]) | map(sort_by(.startedAt) | last)
            | map(. + {label: "\(.main)\(if .dev then " (-dev)" else "" end)"})
            | sort_by(.repo, .label)' <<<"$SEEN")
          {
            echo "### Rebuilds"
            echo ""
            if [ "$(jq length <<<"$LATEST")" -eq 0 ]; then
              echo "_No matching rebuilds observed._"
            else
              echo "| Repo | Image | Changed overlays in build | Result |"
              echo "| --- | --- | --- | --- |"
              jq -r '.[] | "| \(.repo) | \(.label) | \(.overlays | join(", ")) | \(if .result == "Success" then "✅" elif .result == null then "⏳ pending" else "❌ \(.result)" end) |"' <<<"$LATEST"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          RC=0
          if [ "${TIMED_OUT:-false}" = "true" ]; then
            for repo in "${REPOS[@]}"; do
              [ -n "${FINISHED[$repo]:-}" ] || echo "::error::$repo: timed out after ${REBUILD_TIMEOUT_SECONDS}s waiting for rebuilds."
            done
            RC=1
          fi
          FAILED=$(jq -c '[.[] | select(.result != null and .result != "Success")]' <<<"$LATEST")
          if [ "$(jq length <<<"$FAILED")" -ne 0 ]; then
            jq -r '.[] | "::error::Rebuild failed: \(.repo) \(.label) [\(.overlays | join(", "))] — \(.error // "see build log")"' <<<"$FAILED"
            RC=1
          fi
          [ "$RC" -eq 0 ] && echo "All $(jq length <<<"$LATEST") rebuild(s) succeeded."
          exit "$RC"
